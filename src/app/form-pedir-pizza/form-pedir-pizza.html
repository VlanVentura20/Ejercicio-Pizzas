<form>
        <div class="row mb-3">
          <div class="col-md-8">
            <label for="pizza" class="form-label fw-bold">Selecciona una pizza:</label>
            <select class="form-select" id="pizza" name="pizza" required>
              <option value="" selected disabled>Selecciona una pizza</option>
              @for (pizza of pizzas(); track $index) {
              <option [value]="pizzas()[$index].nombre">{{ pizzas()[$index].nombre }}</option>
              }
            </select>
          </div>

          <div class="col-md-4">
            <label for="cantidad" class="form-label fw-bold">Cantidad:</label>
            <input type="number" class="form-control" id="cantidad" name="cantidad" min="1" value="1" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="hora" class="form-label fw-bold">Hora de entrega:</label>
          <div class="col-sm-3">
            <input type="time" class="form-control" name="hora" id="hora" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="direccion" class="form-label fw-bold">Dirección de entrega:</label>
          <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Introduce tu dirección"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Método de pago:</label>

          <div class="form-check">
            <input (change)="seleccionarMetodoPago('bizum')" class="form-check-input" type="radio" name="pago" id="bizum"
              value="bizum" required>
            <label class="form-check-label" for="bizum">Bizum</label>
          </div>
          
          <div class="form-check">
            <input (change)="seleccionarMetodoPago('tarjeta')" class="form-check-input" type="radio" name="pago" id="tarjeta"
              value="tarjeta">
            <label class="form-check-label" for="tarjeta">Tarjeta</label>
          </div>
        </div>

        @if (metodoPagoSeleccionado() === 'bizum') {
        <label class="form-label">Introduce tu número de teléfono:</label>
        <input type="tel" class="form-control" placeholder="Número de teléfono" required>
        } @else if (metodoPagoSeleccionado() === 'tarjeta') {
        <label class="form-label">Número de tarjeta:</label>
        <input type="text" class="form-control" placeholder="Número de tarjeta" required>

        <div class="col-sm-3">
          <label class="form-label mt-3">Fecha de caducidad:</label>
          <input type="month" class="form-control" required>
        </div>

        <label class="form-label mt-3">CVV:</label>
        <input type="text" class="form-control" placeholder="CVV" maxlength="4" required>
        }

        <button type="submit" class="btn btn-danger w-100 mt-4">
          Confirmar pedido
        </button>
      </form>
